[project]
name = "voice-assistant"
version = "0.1.0"
description = "基于唤醒词的语音转文字助手（支持 Windows/Linux/macOS）"
authors = [{ name = "Sorel" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
voice-assistant = "voice_assistant:main"
