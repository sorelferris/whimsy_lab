[project]
name = "image-gen-viz"
version = "0.1.0"
description = "Visualize Stable Diffusion denoising steps in a local web app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "diffusers>=0.31.0",
    "fastapi>=0.115.0",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
    "safetensors>=0.4.5",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
